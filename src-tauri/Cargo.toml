[package]
name = "archiveos"
version = "0.1.0"
edition = "2021"

[lib]
name = "archiveos_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }

# Mac-only: native file drag-out (FR-021). See specs/002-arkhive/plan.md Complexity Tracking.
[target.'cfg(target_os = "macos")'.dependencies]
drag = "2"
